<title>لا يوجد اتصال | قصر المرايا</title>
<style>
:root{--paper:#f6f8f9;--surface:#fff;--ink:#1d2733;--body:#3d4650;--line:#dfe7eb;--brand:#049dc5;--amber:#faab18;--amber-h:#f09c05}
html.dark{--paper:#0f161d;--surface:#19232e;--ink:#f1f5f8;--body:#c9d2d9;--line:#27333f;--brand:#1fb6ea}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--paper);color:var(--body);font-family:"IBM Plex Sans Arabic","IBM Plex Sans","Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.top{height:6px;background:var(--brand)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom,0px));text-align:center}
.logo{width:72px;height:72px;border-radius:14px;background:#fff;border:1px solid var(--line);display:block}
.name{margin:14px 0 0;font-size:14px;font-weight:700;color:var(--brand)}
h1{margin:28px 0 8px;font-size:24px;line-height:1.4;font-weight:700;color:var(--ink)}
p{margin:0;max-width:30em;font-size:16px}
.btn{margin-top:24px;min-width:180px;min-height:48px;padding:10px 24px;border:1px solid var(--amber);border-radius:6px;background:var(--amber);color:#1d2733;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--amber-h);border-color:var(--amber-h)}
.btn:focus-visible,.tel:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.call{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);width:100%;max-width:320px;font-size:14px}
.tel{display:inline-block;margin-top:4px;font-size:28px;font-weight:700;letter-spacing:.04em;color:var(--ink);text-decoration:none;direction:ltr;font-variant-numeric:tabular-nums}
</style>
